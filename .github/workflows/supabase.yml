name: Supabase

on:
  pull_request:
    paths:
      - "supabase/migrations/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Requiere el secreto SUPABASE_ACCESS_TOKEN en el repositorio.
      - name: Validar migraciones contra el proyecto remoto
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db lint --project-ref znknfjujmhbgwywpuzyq
